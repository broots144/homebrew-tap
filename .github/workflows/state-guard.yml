name: state-guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: STATE.md updated with code changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/state-guard.sh "origin/$BASE_REF"
